[General]

## 启动时使用简体中文。false = 保持原版英文（重启游戏生效）。
# Setting type: Boolean
# Default value: true
EnableChinese = true

## 中文字体替换（关闭仅用于排查问题）。
# Setting type: Boolean
# Default value: true
EnableFont = true

## 向 Gridly 文本表注入中文列。
# Setting type: Boolean
# Default value: true
EnableGrid = true

## 翻译场景/预制体里的硬编码 UI 文本。
# Setting type: Boolean
# Default value: true
EnableStaticUI = true

[Debug]

## 把插件调试信息写入 trace.log（排查问题时可打开）。
# Setting type: Boolean
# Default value: false
TraceToFile = false

## 启用的 Harmony 补丁组，一般不需要修改。
# Setting type: String
# Default value: all
PatchGroups = all
